<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar código — RiftZone</title>
    <link href="{{ url_for('static', filename='css/games_sphere.css') }}?v=3" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/glassmorphism.css') }}?v=3" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/riftzone-logo.svg') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#0d0b1a; padding:24px; font-family:'Inter',system-ui,sans-serif; overflow:hidden; position:relative; }
        .bg-anim { position:fixed; inset:0; z-index:0; background:linear-gradient(135deg,#0d0b1a 0%,#1a0a2e 25%,#0d1520 50%,#1a0a2e 75%,#0d0b1a 100%); background-size:400% 400%; animation:bgShift 12s ease infinite; }
        @keyframes bgShift { 0%{background-position:0% 50%} 25%{background-position:50% 0%} 50%{background-position:100% 50%} 75%{background-position:50% 100%} 100%{background-position:0% 50%} }
        .floating-icon { position:fixed; font-size:24px; z-index:1; opacity:0.15; pointer-events:none; animation:floatIcon 8s ease-in-out infinite; }
        .floating-icon:nth-child(1) { top:10%; left:8%; animation-delay:0s; color:#A78BFA; }
        .floating-icon:nth-child(2) { top:20%; right:12%; animation-delay:-1.5s; color:#FF2D95; font-size:30px; }
        .floating-icon:nth-child(3) { bottom:15%; left:15%; animation-delay:-3s; color:#22D3EE; }
        .floating-icon:nth-child(4) { bottom:25%; right:8%; animation-delay:-4.5s; color:#34D399; font-size:20px; }
        .floating-icon:nth-child(5) { top:50%; left:5%; animation-delay:-6s; color:#FACC15; font-size:18px; }
        .floating-icon:nth-child(6) { top:60%; right:5%; animation-delay:-2s; color:#F87171; font-size:22px; }
        @keyframes floatIcon { 0%,100%{transform:translateY(0) rotate(0deg) scale(1)} 25%{transform:translateY(-20px) rotate(5deg) scale(1.1)} 50%{transform:translateY(-10px) rotate(-3deg) scale(0.95)} 75%{transform:translateY(-25px) rotate(3deg) scale(1.05)} }
        #particles-canvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; }
        .glow-orb { position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0; animation:orbFloat 10s ease-in-out infinite alternate; }
        .glow-orb--purple { width:450px; height:450px; background:radial-gradient(circle,rgba(167,139,250,0.4),transparent 70%); top:-150px; left:-100px; }
        .glow-orb--pink { width:380px; height:380px; background:radial-gradient(circle,rgba(255,45,149,0.3),transparent 70%); bottom:-120px; right:-100px; animation-delay:-4s; }
        .glow-orb--cyan { width:300px; height:300px; background:radial-gradient(circle,rgba(34,211,238,0.2),transparent 70%); top:40%; left:50%; animation-delay:-7s; }
        @keyframes orbFloat { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(50px,-40px) scale(1.15)} }
        .auth-container { position:relative; z-index:10; background:linear-gradient(145deg,rgba(25,20,50,0.88),rgba(15,12,35,0.94)); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid rgba(167,139,250,0.1); border-radius:24px; padding:44px 40px; width:100%; max-width:460px; box-shadow:0 0 80px rgba(139,92,246,0.08),0 20px 60px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.03); animation:cardAppear 0.8s cubic-bezier(0.16,1,0.3,1) forwards; transform:translateY(30px); opacity:0; }
        @keyframes cardAppear { to{transform:translateY(0); opacity:1} }
        .auth-container::before,.auth-container::after { content:''; position:absolute; width:2px; height:60%; top:20%; border-radius:4px; opacity:0.3; }
        .auth-container::before { left:-1px; background:linear-gradient(to bottom,transparent,#A78BFA,#FF2D95,transparent); animation:glowBar 3s ease-in-out infinite; }
        .auth-container::after { right:-1px; background:linear-gradient(to bottom,transparent,#22D3EE,#A78BFA,transparent); animation:glowBar 3s ease-in-out infinite alternate; }
        @keyframes glowBar { 0%,100%{opacity:0.15} 50%{opacity:0.4} }
        .logo-center { display:flex; align-items:center; justify-content:center; gap:14px; font-size:30px; font-weight:900; margin-bottom:28px; letter-spacing:2px; }
        .logo-center .logo-icon { width:56px; height:56px; font-size:26px; background:linear-gradient(135deg,#7C3AED,#FF2D95); border-radius:16px; display:flex; align-items:center; justify-content:center; color:#fff; box-shadow:0 0 30px rgba(124,58,237,0.3); animation:logoBounce 3s ease-in-out infinite; }
        @keyframes logoBounce { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-6px) rotate(0deg)} }
        .logo-text { background:linear-gradient(135deg,#C4B5FD,#FF2D95,#22D3EE); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; background-size:200% 200%; animation:textGrad 4s ease infinite; }
        @keyframes textGrad { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .auth-title { text-align:center; font-size:24px; font-weight:800; margin-bottom:6px; background:linear-gradient(135deg,#E0E0FF,#A78BFA); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:0.5px; }
        .auth-subtitle { text-align:center; color:rgba(157,157,181,0.55); font-size:14px; margin-bottom:32px; line-height:1.5; }
        .auth-subtitle strong { color:rgba(167,139,250,0.8); }
        .form-group { margin-bottom:22px; position:relative; }
        .form-label { display:block; margin-bottom:8px; color:rgba(157,157,181,0.6); font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; transition:color 0.3s; }
        .form-group:focus-within .form-label { color:#A78BFA; }
        .input-wrap { position:relative; }
        .input-wrap .input-icon { position:absolute; left:16px; top:50%; transform:translateY(-50%); color:rgba(157,157,181,0.25); font-size:15px; transition:all 0.3s; pointer-events:none; }
        .form-group:focus-within .input-icon { color:#A78BFA; text-shadow:0 0 12px rgba(167,139,250,0.4); }
        .form-control { width:100%; background:rgba(10,8,25,0.5); border:1.5px solid rgba(167,139,250,0.06); border-radius:14px; padding:14px 18px 14px 48px; color:#e8e8ff; font-size:15px; font-family:inherit; transition:all 0.35s ease; outline:none; }
        .form-control:focus { border-color:rgba(167,139,250,0.25); box-shadow:0 0 0 4px rgba(167,139,250,0.06),0 0 30px rgba(167,139,250,0.04); background:rgba(10,8,25,0.7); }
        .form-control::placeholder { color:rgba(157,157,181,0.2); }
        .code-inputs { display:flex; gap:10px; justify-content:center; margin-bottom:8px; }
        .code-inputs input { width:52px; height:60px; text-align:center; font-size:24px; font-weight:800; background:rgba(10,8,25,0.5); border:1.5px solid rgba(167,139,250,0.06); border-radius:14px; color:#C4B5FD; font-family:inherit; outline:none; transition:all 0.3s; letter-spacing:0; }
        .code-inputs input:focus { border-color:rgba(167,139,250,0.4); box-shadow:0 0 0 4px rgba(167,139,250,0.08),0 0 20px rgba(167,139,250,0.06); background:rgba(10,8,25,0.7); transform:translateY(-2px); }
        .code-inputs input::placeholder { color:rgba(157,157,181,0.15); font-size:20px; }
        .btn-login { width:100%; padding:16px; font-size:15px; font-weight:700; font-family:inherit; letter-spacing:1px; border:none; border-radius:14px; cursor:pointer; color:#fff; background:linear-gradient(135deg,#7C3AED,#FF2D95,#7C3AED); background-size:200% 200%; animation:gradientShift 3s ease infinite; margin-top:28px; display:flex; align-items:center; justify-content:center; gap:10px; transition:all 0.3s ease; position:relative; overflow:hidden; text-transform:uppercase; }
        .btn-login::before { content:''; position:absolute; inset:0; background:linear-gradient(135deg,#6D28D9,#E11D8F); opacity:0; transition:opacity 0.4s; }
        .btn-login:hover::before { opacity:1; }
        .btn-login:hover { transform:translateY(-3px); box-shadow:0 0 40px rgba(124,58,237,0.35),0 0 80px rgba(225,29,143,0.15),0 12px 30px rgba(0,0,0,0.4); }
        .btn-login:active { transform:translateY(0) scale(0.98); }
        .btn-login > * { position:relative; z-index:1; }
        @keyframes gradientShift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .btn-resend { display:block; text-align:center; margin-top:20px; color:rgba(167,139,250,0.4); font-size:13px; text-decoration:none; transition:all 0.3s; }
        .btn-resend:hover { color:#A78BFA; }
        .auth-footer { text-align:center; margin-top:20px; font-size:13px; color:rgba(157,157,181,0.4); }
        .auth-footer a { color:rgba(167,139,250,0.6); font-weight:600; text-decoration:none; transition:all 0.3s; }
        .auth-footer a:hover { color:#C4B5FD; }
        .back-link { display:inline-flex; align-items:center; gap:6px; color:rgba(167,139,250,0.5); font-size:13px; text-decoration:none; margin-bottom:24px; transition:color 0.3s; }
        .back-link:hover { color:#A78BFA; }
        .form-group, .auth-title, .auth-subtitle, .code-inputs { animation:fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards; opacity:0; transform:translateY(15px); }
        .auth-title { animation-delay:0.05s; }
        .auth-subtitle { animation-delay:0.1s; }
        .code-inputs { animation-delay:0.15s; }
        .btn-login { animation:fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.25s forwards; opacity:0; transform:translateY(15px); }
        .btn-resend { animation:fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) 0.35s forwards; opacity:0; }
        @keyframes fadeUp { to{opacity:1; transform:translateY(0)} }
        @media (max-width:480px) { .auth-container{padding:32px 24px; border-radius:20px} .code-inputs input{width:44px; height:52px; font-size:20px} .floating-icon{display:none} }
        /* Toast notifications */
        #toast-container { position:fixed; top:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
        .toast { display:flex; align-items:center; gap:10px; padding:14px 20px; border-radius:14px; font-size:13px; font-family:'Inter',system-ui,sans-serif; pointer-events:auto; animation:toastIn 0.4s cubic-bezier(0.16,1,0.3,1) forwards; backdrop-filter:blur(16px); max-width:380px; line-height:1.5; }
        .toast--success { background:rgba(52,211,153,0.08); border:1px solid rgba(52,211,153,0.15); color:#34D399; box-shadow:0 8px 30px rgba(0,0,0,0.3); }
        .toast--error { background:rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.15); color:#F87171; box-shadow:0 8px 30px rgba(0,0,0,0.3); }
        .toast--info { background:rgba(167,139,250,0.08); border:1px solid rgba(167,139,250,0.15); color:#A78BFA; box-shadow:0 8px 30px rgba(0,0,0,0.3); }
        .toast--exiting { animation:toastOut 0.35s ease forwards; }
        @keyframes toastIn { from { opacity:0; transform:translateX(40px) scale(0.95); } to { opacity:1; transform:translateX(0) scale(1); } }
        @keyframes toastOut { to { opacity:0; transform:translateX(40px) scale(0.95); } }
        .toast a { color:#C4B5FD; text-decoration:underline; }
    </style>
</head>
<body>
<div class="bg-anim"></div>
<canvas id="particles-canvas"></canvas>
<div class="glow-orb glow-orb--purple"></div>
<div class="glow-orb glow-orb--pink"></div>
<div class="glow-orb glow-orb--cyan"></div>
<i class="fas fa-gamepad floating-icon"></i>
<i class="fas fa-crown floating-icon"></i>
<i class="fas fa-bolt floating-icon"></i>
<i class="fas fa-skull floating-icon"></i>
<i class="fas fa-dice-d6 floating-icon"></i>
<i class="fas fa-crosshairs floating-icon"></i>

<div class="auth-container">
    <a href="{{ url_for('auth.forgot_password') }}" class="back-link"><i class="fas fa-arrow-left"></i> Volver</a>
    <div class="logo-center">
        <div class="logo-icon"><i class="fas fa-shield-halved"></i></div>
        <span class="logo-text">RiftZone</span>
    </div>
    <h1 class="auth-title">Verificación</h1>
    <p class="auth-subtitle">Ingresa el código de 6 dígitos que enviamos a<br><strong>{{ email }}</strong></p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div id="flash-data" style="display:none;" data-messages='{{ messages | tojson | safe }}'></div>
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.verify_code') }}" novalidate id="verify-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="code-inputs" id="code-inputs">
            <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" required placeholder="·" data-index="0">
            <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="1">
            <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="2">
            <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="3">
            <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="4">
            <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="5">
        </div>
        <input type="hidden" name="code" id="full-code" value="">

        <button type="submit" class="btn-login" id="submit-btn">
            Verificar <i class="fas fa-check-circle"></i>
        </button>
    </form>

    <a href="{{ url_for('auth.forgot_password') }}" class="btn-resend">
        <i class="fas fa-rotate-right"></i> ¿No recibiste el código? Reenviar
    </a>

    <div class="auth-footer">
        <a href="{{ url_for('auth.login') }}">Volver al inicio de sesión</a>
    </div>
</div>

<script>
(function() {
    var canvas = document.getElementById('particles-canvas');
    if (!canvas) return;
    if (window.matchMedia('(max-width: 768px)').matches || window.matchMedia('(prefers-reduced-motion: reduce)').matches) { canvas.style.display = 'none'; return; }
    var ctx = canvas.getContext('2d');
    var particles = [];
    var w, h;
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();
    var COLORS = ['rgba(167, 139, 250,', 'rgba(255, 45, 149,', 'rgba(34, 211, 238,'];
    var PARTICLE_COUNT = 60;
    for (var i = 0; i < PARTICLE_COUNT; i++) { particles.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.5, vy: (Math.random() - 0.5) * 0.5, r: Math.random() * 2 + 1, color: COLORS[Math.floor(Math.random() * COLORS.length)], alpha: Math.random() * 0.3 + 0.05 }); }
    function animate() {
        ctx.clearRect(0, 0, w, h);
        for (var i = 0; i < particles.length; i++) { var p = particles[i]; p.x += p.vx; p.y += p.vy; if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10; if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = p.color + p.alpha + ')'; ctx.fill(); }
        requestAnimationFrame(animate);
    }
    animate();
})();

// Code input behavior
(function() {
    var inputs = document.querySelectorAll('#code-inputs input');
    var fullCode = document.getElementById('full-code');

    inputs.forEach(function(input, idx) {
        input.addEventListener('input', function(e) {
            var val = this.value.replace(/[^0-9]/g, '');
            this.value = val.slice(-1);
            if (val && idx < inputs.length - 1) {
                inputs[idx + 1].focus();
            }
            updateFullCode();
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && idx > 0) {
                inputs[idx - 1].focus();
            }
            if (e.key === 'Enter') {
                document.getElementById('verify-form').submit();
            }
        });

        input.addEventListener('paste', function(e) {
            e.preventDefault();
            var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
            for (var i = 0; i < paste.length && i + idx < inputs.length; i++) {
                inputs[i + idx].value = paste[i];
            }
            var nextIdx = Math.min(idx + paste.length, inputs.length - 1);
            inputs[nextIdx].focus();
            updateFullCode();
        });

        input.addEventListener('focus', function() { this.select(); });
    });

    function updateFullCode() {
        var code = '';
        inputs.forEach(function(inp) { code += inp.value; });
        fullCode.value = code;
    }

    // Auto-submit when all 6 digits entered
    var observer = new MutationObserver(updateFullCode);
    inputs.forEach(function(inp) { observer.observe(inp, { childList: true, characterData: true, subtree: true }); });

    document.getElementById('verify-form').addEventListener('submit', function(e) {
        var code = '';
        inputs.forEach(function(inp) { code += inp.value; });
        if (code.length < 6) {
            if (typeof showToast === 'function') showToast('Ingresa los 6 dígitos del código.', 'error');
            e.preventDefault();
            return false;
        }
        // Remove the individual code inputs before submitting, keep only full-code
        inputs.forEach(function(inp) { inp.name = ''; });
        fullCode.name = 'code';
        var btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
    });
})();
</script>
<script>
if (typeof showToast !== 'function') {
  function showToast(msg, type) {
    type = type || 'success';
    var c = document.getElementById('toast-container');
    if (!c) { c = document.createElement('div'); c.id = 'toast-container'; document.body.appendChild(c); }
    var icons = { error: 'fa-exclamation-circle', info: 'fa-info-circle', success: 'fa-check-circle' };
    var t = document.createElement('div');
    t.className = 'toast toast--' + type;
    t.innerHTML = '<i class="fas ' + (icons[type] || 'fa-check-circle') + '"></i> ' + msg;
    c.appendChild(t);
    setTimeout(function(){ t.classList.add('toast--exiting'); setTimeout(function(){ t.remove(); }, 350); }, 4000);
  }
}
(function() {
  var el = document.getElementById('flash-data');
  if (!el) return;
  try {
    var messages = JSON.parse(el.getAttribute('data-messages') || '[]');
    if (Array.isArray(messages)) {
      messages.forEach(function(item) {
        if (Array.isArray(item)) { showToast(item[1], item[0] === 'error' ? 'error' : 'success'); }
      });
    }
  } catch(e) {}
  el.remove();
})();
</script>
</body>
</html>
