<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar código — RiftZone</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/riftzone-logo.svg') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth_v3.css') }}">
</head>
<body>

<div class="aurora">
    <div class="aurora-blob ab1"></div>
    <div class="aurora-blob ab2"></div>
    <div class="aurora-blob ab3"></div>
    <div class="aurora-blob ab4"></div>
</div>
<canvas class="stars" id="stars-canvas"></canvas>
<div class="noise"></div>
<canvas id="particles"></canvas>
<canvas id="confetti"></canvas>

<div class="card" style="max-width:480px;">
    <div class="card-inner" id="card-inner">

        <a href="{{ url_for('auth.forgot_password') }}" class="back-link s1"><i class="fas fa-arrow-left"></i> Volver</a>

        <div class="brand s2">
            <div class="brand-icon"><i class="fas fa-shield-halved"></i></div>
            <h1>RiftZone</h1>
        </div>

        <h2 class="auth-title s3">Verificación</h2>
        <p class="auth-subtitle s3">Ingresa el código de 6 dígitos que enviamos a<br><strong>{{ email }}</strong></p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div id="flash-data" style="display:none;" data-messages='{{ messages | tojson | safe }}'></div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.verify_code') }}" novalidate id="verify-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="code-inputs s4" id="code-inputs">
                <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" required placeholder="·" data-index="0">
                <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="1">
                <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="2">
                <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="3">
                <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="4">
                <input type="text" name="code" maxlength="1" inputmode="numeric" pattern="[0-9]" required placeholder="·" data-index="5">
            </div>
            <input type="hidden" name="code" id="full-code" value="">

            <button type="submit" class="btn-submit s5" id="btn-submit">
                <span class="btn-text">Verificar código</span>
                <span class="loading-text"><span class="loading-dots"><span></span><span></span><span></span></span> Verificando</span>
                <span class="spinner"></span>
                <i class="fas fa-check-circle btn-arrow" style="position:relative;z-index:1;"></i>
            </button>
        </form>

        <a href="{{ url_for('auth.forgot_password') }}" class="resend-link s6">
            <i class="fas fa-rotate-right"></i> ¿No recibiste el código? Reenviar
        </a>

        <div class="card-footer s7">
            <a href="{{ url_for('auth.login') }}">Volver al inicio de sesión</a>
        </div>
    </div>
</div>

<div id="toasts"></div>

<script src="{{ url_for('static', filename='js/auth_v3.js') }}"></script>
<script>
(function() {
    var inputs = document.querySelectorAll('#code-inputs input');
    var fullCode = document.getElementById('full-code');

    inputs.forEach(function(input, idx) {
        input.addEventListener('input', function(e) {
            var val = this.value.replace(/[^0-9]/g, '');
            this.value = val.slice(-1);
            if (val && idx < inputs.length - 1) inputs[idx + 1].focus();
            updateFullCode();
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && idx > 0) inputs[idx - 1].focus();
            if (e.key === 'Enter') document.getElementById('verify-form').submit();
        });
        input.addEventListener('paste', function(e) {
            e.preventDefault();
            var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
            for (var i = 0; i < paste.length && i + idx < inputs.length; i++) inputs[i + idx].value = paste[i];
            var nextIdx = Math.min(idx + paste.length, inputs.length - 1);
            inputs[nextIdx].focus();
            updateFullCode();
        });
        input.addEventListener('focus', function() { this.select(); });
    });

    function updateFullCode() {
        var code = '';
        inputs.forEach(function(inp) { code += inp.value; });
        fullCode.value = code;
    }

    document.getElementById('verify-form').addEventListener('submit', function(e) {
        var code = '';
        inputs.forEach(function(inp) { code += inp.value; });
        if (code.length < 6) {
            showToast('Ingresa los 6 dígitos del código.', 'error');
            e.preventDefault();
            // Shake the first empty input
            for (var i = 0; i < inputs.length; i++) {
                if (!inputs[i].value) { inputs[i].focus(); break; }
            }
            return;
        }
        inputs.forEach(function(inp) { inp.name = ''; });
        fullCode.name = 'code';
        document.getElementById('btn-submit').classList.add('loading');
    });
})();

// Auto-focus first code input
setTimeout(function() {
    var first = document.querySelector('#code-inputs input');
    if (first) first.focus();
}, 800);
</script>
</body>
</html>
