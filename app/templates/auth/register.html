<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - RiftZone</title>
    
    <link href="{{ url_for('static', filename='css/riftzone.css') }}" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, var(--bg-panel) 0%, var(--bg-dark) 100%);
            padding: 24px;
        }
        
        .auth-container {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-magenta));
        }
        
        .logo-center {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 32px;
        }
        
        .logo-center .logo-icon {
            width: 48px; height: 48px;
            font-size: 24px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
        }
        
        .form-control {
            width: 100%;
            background-color: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: white;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
        }
        
        .btn-block {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            justify-content: center;
            margin-top: 24px;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-muted);
        }
        
        .auth-footer a {
            color: var(--accent-purple);
            font-weight: 600;
        }
        
        .alert {
            background-color: rgba(255, 45, 149, 0.1);
            border-left: 4px solid var(--accent-magenta);
            color: white;
            padding: 12px 16px;
            margin-bottom: 24px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo-center">
        <div class="logo-icon"><i class="fas fa-gamepad"></i></div>
        RiftZone
    </div>
    
    <h2 style="text-align:center; margin-bottom:8px;">Únete a la zona</h2>
    <p style="text-align:center; color:var(--text-muted); margin-bottom:32px; font-size:14px;">Crea tu cuenta gamer y empieza a jugar.</p>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert">
                    <i class="fas fa-exclamation-circle" style="margin-right:8px; color:var(--accent-magenta);"></i> {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        <div class="form-group">
            <label class="form-label">Nombre de invocador / GamerTag</label>
            <input type="text" name="nombre" class="form-control" required placeholder="Ej. Alex Mercer">
        </div>
        
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required placeholder="@tu_user">
        </div>
        
        <div class="form-group">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" name="email" class="form-control" required placeholder="correo@ejemplo.com">
        </div>
        
        <div class="form-group">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required placeholder="Mínimo 6 caracteres" minlength="6">
        </div>
        
        <button type="submit" class="btn-primary btn-block">Registrarse <i class="fas fa-arrow-right"></i></button>
    </form>
    
    <div class="auth-footer">
        ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión aquí</a>
    </div>
</div>

</body>
</html>
